<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 110" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Earth Eye</title>
  <style>
    .ee-spin,
    .ee-orbit,
    .ee-sheen {
      transform-box: fill-box;
      transform-origin: center;
    }
    .ee-spin { animation: ee-spin 36s linear infinite; }
    .ee-orbit { animation: ee-orbit 22s linear infinite; }
    .ee-orbit-b { animation-duration: 34s; animation-direction: reverse; }
    .ee-sheen { animation: ee-sheen 7.5s ease-in-out infinite; }
    @keyframes ee-spin { to { transform: rotate(360deg); } }
    @keyframes ee-orbit { to { transform: rotate(360deg); } }
    @keyframes ee-sheen {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ee-spin, .ee-orbit, .ee-sheen { animation: none; }
      .ee-sheen { opacity: 0.35; }
    }
  </style>
  <text x="4" y="74" fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="500" letter-spacing="7">EARTH</text>
  <text x="548" y="74" fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="500" letter-spacing="7">EYE</text>
  <g id="globe_cage" fill="none" stroke="#f4f4f4" stroke-width="1.35">
    <g class="ee-orbit">
      <ellipse cx="430" cy="55" rx="46" ry="16" transform="rotate(-28 430 55)" />
      <rect x="470" y="53.2" width="8" height="2.4" fill="#f4f4f4" stroke="none" transform="rotate(-28 430 55)" />
      <rect x="384" y="53.2" width="6" height="2.2" fill="#c8c8c8" stroke="none" transform="rotate(-28 430 55)" />
    </g>
    <g class="ee-orbit ee-orbit-b">
      <ellipse cx="430" cy="55" rx="44" ry="15" transform="rotate(36 430 55)" />
      <rect x="466" y="53.4" width="7" height="2.2" fill="#e6e6e6" stroke="none" transform="rotate(36 430 55)" />
    </g>
  </g>
  <g id="globe">
    <g class="ee-spin">
      <circle cx="430" cy="55" r="23" fill="#0a0a0a" stroke="#f4f4f4" stroke-width="1.5" />
      <g clip-path="url(#ee-disc)">
        <ellipse cx="430" cy="55" rx="9" ry="23" fill="none" stroke="#d0d0d0" stroke-width="1" />
        <ellipse cx="430" cy="55" rx="17" ry="23" fill="none" stroke="#bdbdbd" stroke-width="1" />
        <ellipse cx="430" cy="55" rx="23" ry="8" fill="none" stroke="#d8d8d8" stroke-width="1" />
        <path d="M418 46c3-7 11-8 14-1 2 4-1 8-6 8-4 0-8-3-8-7z" fill="#f2f2f2" stroke="none" />
        <path d="M432 58c5 1 8 6 4 9-5 3-11-1-10-6 0-2 3-3 6-3z" fill="#dedede" stroke="none" />
        <path d="M421 66c2 3 7 3 8 0 0-2-3-3-5-2-2 0-3 1-3 2z" fill="#f7f7f7" stroke="none" />
      </g>
    </g>
    <ellipse class="ee-sheen" cx="422" cy="46" rx="7" ry="4" fill="#ffffff" stroke="none" />
    <circle cx="430" cy="55" r="23" fill="none" stroke="#f4f4f4" stroke-width="1.5" />
  </g>
  <defs>
    <clipPath id="ee-disc">
      <circle cx="430" cy="55" r="22" />
    </clipPath>
  </defs>
</svg>
