# Earth Eye on Fly.io. See DEPLOY_FLY.md.
#
# Option C (Ruben confirmed KEEP 2026-09-29): always-on + 1 GB volume with
# daily snapshots (5-day retention). Still one machine, --ha=false, no IPv4.
app = "eartheye"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  EE_COLLECTION_CONTINUOUS = "1"
  EE_COLLECTION_DATA_DIR = "/data/collection"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "eartheye_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
